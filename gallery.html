  <!-- Full-size photo viewer -->
  <dialog class="lightbox" aria-label="Photo viewer">
    <img src="" alt="">
    <div class="lightbox-bar">
      <span class="lightbox-caption"></span>
      <button class="lightbox-close" type="button" aria-label="Close">×</button>
    </div>
  </dialog>

  <script>
    (function () {
      var dialog = document.querySelector('.lightbox');
      if (!dialog || typeof dialog.showModal !== 'function') return;

      var img = dialog.querySelector('img');
      var caption = dialog.querySelector('.lightbox-caption');

      document.querySelectorAll('.gallery a').forEach(function (link) {
        link.addEventListener('click', function (e) {
          e.preventDefault();
          var thumb = link.querySelector('img');
          var figcaption = link.parentElement.querySelector('figcaption');
          img.src = link.href;
          img.alt = thumb ? thumb.alt : '';
          caption.textContent = figcaption ? figcaption.textContent : '';
          dialog.showModal();
        });
      });

      dialog.querySelector('.lightbox-close').addEventListener('click', function () {
        dialog.close();
      });

      // Close when clicking the dark backdrop
      dialog.addEventListener('click', function (e) {
        if (e.target === dialog) dialog.close();
      });
    })();
  </script>
