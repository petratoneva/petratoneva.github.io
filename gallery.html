  <script>
    // Photo carousel: builds arrows, counter and thumbnails from the <figure> blocks
    (function () {
      var track = document.querySelector('.gallery');
      if (!track) return;

      var slides = Array.prototype.slice.call(track.querySelectorAll('figure'));
      var prev = document.querySelector('.carousel-prev');
      var next = document.querySelector('.carousel-next');
      var count = document.querySelector('.carousel-count');
      var thumbs = document.querySelector('.carousel-thumbs');
      var current = 0;

      if (slides.length < 2) {
        prev.hidden = true;
        next.hidden = true;
      }

      // Clicking a photo opens the original in a new tab
      track.querySelectorAll('a').forEach(function (a) {
        a.target = '_blank';
        a.rel = 'noopener';
      });

      // Thumbnails
      var thumbButtons = slides.map(function (slide, i) {
        var img = slide.querySelector('img');
        var b = document.createElement('button');
        b.type = 'button';
        b.className = 'carousel-thumb';
        b.setAttribute('aria-label', 'Show photo ' + (i + 1));
        var t = document.createElement('img');
        t.src = img.getAttribute('src');
        t.alt = '';
        t.loading = 'lazy';
        b.appendChild(t);
        b.addEventListener('click', function () { go(i); });
        thumbs.appendChild(b);
        return b;
      });

      function go(i) {
        var n = slides.length;
        i = (i + n) % n;                       // wrap around at the ends
        track.scrollTo({ left: i * track.clientWidth, behavior: 'smooth' });
      }

      function update() {
        var i = Math.round(track.scrollLeft / track.clientWidth);
        if (i === current && count.textContent) return;
        current = Math.max(0, Math.min(slides.length - 1, i));
        count.textContent = (current + 1) + ' / ' + slides.length;
        thumbButtons.forEach(function (b, j) {
          b.classList.toggle('is-active', j === current);
          b.setAttribute('aria-current', j === current ? 'true' : 'false');
        });
        var active = thumbButtons[current];
        if (active) {
          var tr = thumbs.getBoundingClientRect();
          var ar = active.getBoundingClientRect();
          var left = thumbs.scrollLeft + (ar.left - tr.left) - (thumbs.clientWidth - ar.width) / 2;
          thumbs.scrollTo({ left: left, behavior: 'smooth' });
        }
      }

      prev.addEventListener('click', function () { go(current - 1); });
      next.addEventListener('click', function () { go(current + 1); });

      track.addEventListener('keydown', function (e) {
        if (e.key === 'ArrowLeft') { e.preventDefault(); go(current - 1); }
        if (e.key === 'ArrowRight') { e.preventDefault(); go(current + 1); }
      });

      var timer;
      track.addEventListener('scroll', function () {
        clearTimeout(timer);
        timer = setTimeout(update, 60);
      });
      window.addEventListener('resize', function () {
        track.scrollLeft = current * track.clientWidth;
      });

      update();
    })();
  </script>
